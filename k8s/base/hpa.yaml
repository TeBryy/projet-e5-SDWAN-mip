# HPA de 3 à 20 pods sur le CPU (70 %)
# scale down après 60 s au lieu de 5 min par défaut, pour voir le retour à 3 plus vite
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vitrine-mip-04-11-2026
  labels:
    nom: peiffer
    prenom: axel
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: vitrine-mip-04-11-2026 }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - { type: Percent, value: 100, periodSeconds: 15 }
        - { type: Pods, value: 4, periodSeconds: 15 }
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - { type: Percent, value: 50, periodSeconds: 30 }
