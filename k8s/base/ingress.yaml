apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vitrine-mip-04-11-2026
  labels:
    nom: mahaut
    prenom: bryan
spec:
  ingressClassName: traefik
  rules:
    - host: HOST_VITRINE
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: vitrine-mip-04-11-2026, port: { name: http } }
