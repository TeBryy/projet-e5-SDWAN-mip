# stock : API interne, pas d'Ingress (ClusterIP seulement)
apiVersion: v1
kind: Service
metadata:
  name: stock-mip-04-11-2026
  labels:
    nom: mahaut
    prenom: bryan
spec:
  type: ClusterIP
  selector:
    app: stock-mip-04-11-2026
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-mip-04-11-2026
  labels:
    nom: mahaut
    prenom: bryan
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: stock-mip-04-11-2026
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        nom: mahaut
        prenom: bryan
        app: stock-mip-04-11-2026
        app.kubernetes.io/name: stock
        app.kubernetes.io/component: backend-interne
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: stock-mip-04-11-2026
          image: DOCKERHUB_USER/stock-mip-04-11-2026
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: APP_ENV
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          # voir docs/mesures-ressources.md
          resources:
            requests: { cpu: 25m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 48Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
