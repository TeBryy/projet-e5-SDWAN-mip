name: ci-mip-04-11-2026

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests-go:
    runs-on: ubuntu-latest
    strategy:
      matrix: { app: [stock, vitrine, paiement] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - working-directory: apps/${{ matrix.app }}
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kustomize + kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for env in dev mlops preprod prod; do
            kubectl kustomize k8s/overlays/$env | ./kubeconform -strict -summary -kubernetes-version 1.33.0
          done
          kubectl kustomize k8s/loadtest | ./kubeconform -strict -summary

  images:
    needs: [tests-go, manifests]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix: { app: [stock, vitrine, paiement] }
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ matrix.app }}-mip-04-11-2026
    steps:
      - uses: actions/checkout@v4
      - name: version
        run: echo "VERSION=$(grep '^VERSION=' config.env | cut -d= -f2 | awk '{print $1}')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: installer trivy
        env: { TRIVY_VERSION: "0.70.0" }
        run: |
          base=https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}
          archive=trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz
          curl -sSLO "$base/$archive" && curl -sSLO "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " $archive$" trivy_${TRIVY_VERSION}_checksums.txt | sha256sum -c -
          mkdir -p "$HOME/bin" && tar xzf "$archive" -C "$HOME/bin" trivy
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: scan trivy
        run: trivy image --no-progress --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$IMAGE:${{ github.sha }}"
      - uses: docker/login-action@v3
        if: env.DH_USER != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: push Docker Hub
        if: env.DH_USER != ''
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
